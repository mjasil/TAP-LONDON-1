name: One-time image resolution fix

on:
  workflow_dispatch: {}

jobs:
  fix-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - name: Audit filters
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/audit-filters.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add filter-audit.txt
          git commit -m "filter audit" || echo nothing
          git push
