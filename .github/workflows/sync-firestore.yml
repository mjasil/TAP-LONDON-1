name: Sync Content to Firestore

on:
  workflow_dispatch: {}  # allows manual trigger from the Actions tab too
  push:
    branches: [main]
    paths:
      - 'data/**.json'  # also runs automatically whenever data files change
      - 'scripts/sync-firestore.js'
      - 'scripts/directory-keys.js'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Run sync script
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/sync-firestore.js
